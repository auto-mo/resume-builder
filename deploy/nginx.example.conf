# Example: serve the resume builder at https://your-domain.com/resume/
# behind Nginx, proxying to the Flask app on :5001.
server {
    listen 80;
    server_name your-domain.com;

    # Nginx strips the /resume prefix before forwarding.
    location /resume/ {
        proxy_pass         http://localhost:5001/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /resume {
        return 301 /resume/;
    }
}
